name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run tests
        run: swift test

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64 --product spatial-photo-extractor
          mkdir -p ./dist
          cp "$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/spatial-photo-extractor" ./dist/

      - name: Create README.url file
        run: |
          echo "[InternetShortcut]" > ./dist/README.url
          echo "URL=https://github.com/CatChen/spatial-photo-extractor/blob/main/README.md" >> ./dist/README.url

      - name: Create DMG file
        run: |
          hdiutil create ./spatial-photo-extractor.dmg -volname "spatial-photo-extractor" -srcfolder ./dist -ov -format UDZO

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./spatial-photo-extractor.dmg --title "Release $GITHUB_REF_NAME"
